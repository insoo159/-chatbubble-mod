name: Build Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 檢出程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設定 Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. 指定安裝 Gradle 8.8
      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      # 4. 生成 Wrapper 並進行編譯 (加入 --refresh-dependencies)
      - name: Build with Gradle
        run: |
          gradle wrapper --gradle-version 8.8
          chmod +x gradlew
          ./gradlew build --no-daemon --refresh-dependencies

      # 5. 上傳產出的 .jar 檔案
      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: CustomChat-Mod-JAR
          path: build/libs/*.jar
